name: Pipeline Diari Autònom de Prediccions

on:
  schedule:
    # Execució diària automàtica a les 08:00 UTC (10:00 hora de Barcelona/Madrid)
    - cron: '0 8 * * *'
  workflow_dispatch:
    inputs:
      force:
        description: 'Forçar execució i predicció de la jornada encara que faltin >28h'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  run-pipeline:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Baixar repositori (Checkout)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 2. Configurar entorn Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: 3. Instal·lar dependències del model
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 4. Executar Màquina d'Estats Diària
        env:
          GMAIL_SENDER_EMAIL: ${{ secrets.GMAIL_SENDER_EMAIL }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          EMAIL_RECIPIENTS: ${{ secrets.EMAIL_RECIPIENTS }}
          VERCEL_WEB_URL: ${{ secrets.VERCEL_WEB_URL }}
        run: |
          if [ "${{ github.event.inputs.force }}" = "true" ]; then
            python daily_runner.py --force
          else
            python daily_runner.py
          fi

      - name: 5. Desar i fer push de la Base de Dades, Estat i Web a GitHub
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/laliga.db data/pipeline_state.json data/changelog.json web/data/data.json
          git commit -m "chore: actualització automàtica de dades i web [skip ci]" || echo "Sense canvis per fer commit"
          git push
